org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=false
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.enableR8.fullMode=true
# AGP 8.5 + Gradle 8.7: run Gradle with JDK 17 (Android Studio: Gradle JDK = 17)
# SDK path belongs in local.properties, not here (see local.properties.example)
org.gradle.java.installations.locations=/usr/lib/jvm/java-17-openjdk-amd64
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
